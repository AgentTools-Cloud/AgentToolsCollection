# Publish agent-tools-mcp/server.json to the official MCP Registry.
# The org namespace io.github.AgentTools-Cloud needs GitHub OIDC (no token):
# push a tag like agent-tools-mcp-v0.5.0 after the PyPI release.
name: publish-mcp-registry

on:
  push:
    tags: ["agent-tools-mcp-v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches server.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#agent-tools-mcp-v}"
          got=$(python3 -c 'import json;print(json.load(open("agent-tools-mcp/server.json"))["version"])')
          test "$want" = "$got" || { echo "tag $want != server.json $got"; exit 1; }
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        working-directory: agent-tools-mcp
        run: ../mcp-publisher publish
