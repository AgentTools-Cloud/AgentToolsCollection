# Cache only the public A2A directory page. POST /a2a remains uncached and
# reaches the A2A JSON-RPC handler through the same exact location.
location = /a2a {
    include /etc/nginx/snippets/csp-report-only.conf;
    proxy_pass http://agent_tools_app;
    # POST is a model run: never replay it on another upstream (double cost,
    # double count). GET (the cached directory page) may still fail over.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";

    proxy_cache agent_tools_a2a;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
    proxy_cache_valid 200 30s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-A2A-Cache $upstream_cache_status always;

    proxy_connect_timeout 5s;
    # The analyst may run up to 90 s (reports); Cloudflare cuts at 100 s.
    proxy_read_timeout 100s;
    proxy_send_timeout 30s;
    proxy_buffering on;

    add_header Access-Control-Expose-Headers "PAYMENT-REQUIRED, PAYMENT-RESPONSE, payment-required, payment-response" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, A2A-Version, PAYMENT-SIGNATURE, payment-signature, X-PAYMENT, x-payment" always;
}
