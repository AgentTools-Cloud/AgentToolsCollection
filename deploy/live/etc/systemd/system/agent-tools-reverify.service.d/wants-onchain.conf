# onchain 读 services.payment，payment 由本单元写入，必须排在本单元之后。
# 原先靠两个 timer 同为 OnCalendar=daily 同刻入队来让 onchain 的 After= 生效；
# 错峰成 00:40 / 01:40 后它们是两个独立 transaction，After= 完全失效
# （实测 2026-09-08：onchain 00:40 跑完，reverify 01:40 才开始）。
# 这里由 Wants= 把 onchain 拉进同一 transaction，配合它自己的
# After=agent-tools-reverify.service 得到确定的先后关系，与触发时刻无关。
# onchain.timer 已 disable，onchain 只经由本单元触发。
[Unit]
Wants=agent-tools-onchain.service
