# 2026-11-02: retry fired while the 04:00 daily backup held the NFS queue
# lock and failed with BlockingIOError. Skip (not fail) while backup runs.
# A running Type=oneshot unit is "activating", which is-active reports as not active.
[Service]
ExecCondition=/bin/sh -c '! systemctl show -p ActiveState --value agent-tools-backup.service | grep -qxE "activating|active|deactivating|reloading"'
