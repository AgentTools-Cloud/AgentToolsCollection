# A late or manual health round (11-17: rerun from 18:18) must not overlap the crawl's
# 2.8 GB peak. Polls instead of After=: health is already ordered After= the crawl.
[Service]
ExecStartPre=/usr/bin/timeout 3h /bin/sh -c 'while systemctl show -p ActiveState --value agent-tools-health.service | grep -qxE "activating|active|deactivating|reloading"; do sleep 60; done'
