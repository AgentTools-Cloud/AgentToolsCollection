# Judge health's round once it is over (queued or running), but run anyway after 8 h:
# an unbounded After= would silence the alert when something upstream hangs.
[Service]
ExecStartPre=-/usr/bin/timeout 8h /bin/sh -c 'while systemctl list-jobs --no-legend agent-tools-health.service | grep -q . || systemctl show -p ActiveState --value agent-tools-health.service | grep -qxE "activating|active|deactivating|reloading"; do sleep 60; done'
