# 256M 时常驻 249M、141M 进 swap，峰值已触顶；swap 抖动会拉长 SQLite 持锁时间。
# 单 worker 时一个慢查询会阻塞全站，路由改线程池后再补一个 worker 做冗余。
# 2026-09-22：768M -> 2G；仅提高主站总内存上限，worker/端口不变。
[Service]
MemoryMax=2G
ExecStart=
ExecStart=/opt/mcpserver/.venv/bin/python -m uvicorn server:app --host 127.0.0.1 --port 9100 --workers 2 --log-level info --no-access-log