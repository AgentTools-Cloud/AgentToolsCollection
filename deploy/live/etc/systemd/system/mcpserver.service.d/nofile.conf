# 2026-11-15: soft open-files limit was 1024. At 14:45 a ~30 req/s burst on
# detail pages produced 23 "sqlite3.OperationalError: unable to open database
# file" (each SQLite connection holds the db, -wal and -shm). Not proven to be
# EMFILE, but the limit is cheap to raise.
[Service]
LimitNOFILE=65536
