server {
    include /etc/nginx/snippets/shared-ip-blacklist-enforce.conf;
    include /etc/nginx/snippets/csp-report-only.conf;
    include /etc/nginx/snippets/csp-report-location.conf;
    server_name agent-tools.cloud www.agent-tools.cloud;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Cloudflare in front handles TLS; this origin only speaks HTTP.
    # Trust X-Forwarded-Proto so x402 builds https:// resource URLs.

    client_max_body_size 4m;

    access_log /var/log/nginx/agent-tools.cloud.access.log x402 if=$agent_tools_loggable;
    access_log /var/log/nginx/aop-rollout.log aop_test if=$agent_tools_loggable;
    error_log  /var/log/nginx/agent-tools.cloud.error.log;

    # Canonicalise www -> apex (apex is the host Google has indexed).
    if ($host = www.agent-tools.cloud) { return 301 https://agent-tools.cloud$request_uri; }

    # x402.fuchss.app repeatedly probes our retired /v1/* x402 endpoints;
    # return 429 at the edge instead of letting it crawl the app.
    if ($http_user_agent ~* "(x402-observer|x402\.fuchss\.app)") { return 429; }

    location = /mcp/v2 { return 301 https://$host/mcp-discovery/; }

    include /etc/nginx/snippets/junk-paths-agent-tools.conf;

    # leagle-chat backend (US case law conversational retrieval).
    # CORS handled by the FastAPI app (origin locked to GitHub Pages); do NOT
    # add CORS headers here or they would duplicate. SSE needs buffering off.
    # leagle-chat 已迁至 juricodex.online（同后端 127.0.0.1:8600，根路径同源）
    location /leagle/ { return 301 https://juricodex.online/; }
    location = /leagle { return 301 https://juricodex.online/; }

    include /etc/nginx/snippets/agent-tools-a2a-cache.conf;

    location / {
        include /etc/nginx/snippets/csp-report-only.conf;
        proxy_pass http://agent_tools_app;
        # POST may run a model or write; nginx still fails over when the request
        # never reached an upstream (connect error), but never replays a sent POST.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_hide_header X-Agent-Tools-Privacy-Suppressed;
        proxy_buffering off;
        proxy_read_timeout 600s;
        add_header Access-Control-Expose-Headers "PAYMENT-REQUIRED, PAYMENT-RESPONSE, payment-required, payment-response" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, PAYMENT-SIGNATURE, payment-signature, X-PAYMENT, x-payment" always;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agent-tools.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agent-tools.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;

}
server {
    include /etc/nginx/snippets/shared-ip-blacklist-enforce.conf;
    if ($host = agent-tools.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = www.agent-tools.cloud) {
        return 301 https://agent-tools.cloud$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name agent-tools.cloud www.agent-tools.cloud;
    access_log off;
    return 404; # managed by Certbot


}
