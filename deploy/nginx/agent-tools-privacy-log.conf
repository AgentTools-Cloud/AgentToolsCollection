# Keep privacy-erased slugs out of access logs without storing those slugs in
# nginx configuration. The application derives the marker from keyed digests.
map "$host:$upstream_http_x_agent_tools_privacy_suppressed" $agent_tools_loggable {
    default                       0;
    "agent-tools.cloud:"         1;
    "agent-tools.cloud:1"        0;
}