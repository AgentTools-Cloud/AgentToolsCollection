# /etc/systemd/system/agent-tools-onchain.service.d/etherscan.conf
# API keys for per-address USDC lookups: Etherscan V2 (EVM chains on its free tier)
# and Helius (Solana). Keys live only in root-0600 files under /etc/agent-tools/.
[Service]
EnvironmentFile=-/etc/agent-tools/etherscan.env
EnvironmentFile=-/etc/agent-tools/helius.env
