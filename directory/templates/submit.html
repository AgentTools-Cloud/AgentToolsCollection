{% extends "base.html" %}
{% block title %}提交服务 — agent-tools.cloud{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">提交一个 x402 服务</h1>
<p class="text-slate-600 mb-6">收录前会人工审核。也可以直接 POST 到 <code class="bg-slate-100 px-1 rounded">/api/v1/submit</code>。</p>

<form id="submit-form" class="bg-white border border-slate-200 rounded-lg p-5 space-y-4 max-w-xl" onsubmit="return submitForm(event)">
  <div><label class="block text-sm font-medium mb-1">名称 *</label>
    <input name="name" required class="w-full px-3 py-2 border border-slate-300 rounded"></div>
  <div><label class="block text-sm font-medium mb-1">URL *</label>
    <input name="url" type="url" required placeholder="https://..." class="w-full px-3 py-2 border border-slate-300 rounded"></div>
  <div><label class="block text-sm font-medium mb-1">简介</label>
    <textarea name="description" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded"></textarea></div>
  <div class="grid grid-cols-2 gap-3">
    <div><label class="block text-sm font-medium mb-1">分类</label>
      <input name="category" placeholder="weather / data / inference / ..." class="w-full px-3 py-2 border border-slate-300 rounded"></div>
    <div><label class="block text-sm font-medium mb-1">单价 (USDC)</label>
      <input name="price_usdc" type="number" step="0.0001" min="0" class="w-full px-3 py-2 border border-slate-300 rounded"></div>
  </div>
  <div><label class="block text-sm font-medium mb-1">链(逗号分隔)</label>
    <input name="chains" placeholder="base, solana" class="w-full px-3 py-2 border border-slate-300 rounded"></div>
  <div><label class="block text-sm font-medium mb-1">联系方式(邮箱 / Twitter / TG,可选)</label>
    <input name="contact" class="w-full px-3 py-2 border border-slate-300 rounded"></div>
  <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">提交</button>
  <div id="submit-result" class="text-sm"></div>
</form>

<script>
async function submitForm(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const chains = (f.get("chains") || "").split(/[,\s]+/).filter(Boolean);
  const body = {
    name: f.get("name"), url: f.get("url"),
    description: f.get("description") || null,
    category: f.get("category") || null,
    chains: chains.length ? chains : null,
    price_usdc: f.get("price_usdc") ? Number(f.get("price_usdc")) : null,
    contact: f.get("contact") || null,
  };
  const out = document.getElementById("submit-result");
  out.textContent = "提交中…";
  try {
    const r = await fetch("/api/v1/submit", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    if (r.ok) { out.textContent = "已提交,等待审核。"; out.className = "text-sm text-green-600"; e.target.reset(); }
    else { out.textContent = "提交失败:" + await r.text(); out.className = "text-sm text-red-600"; }
  } catch (err) { out.textContent = "提交失败:" + err; out.className = "text-sm text-red-600"; }
  return false;
}
</script>
{% endblock %}
